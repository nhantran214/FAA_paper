# The exact environment of the paper's baselines: `pip freeze` of the project venv
# (.venv, Python 3.13) on the development machine, which holds the project with its dev
# and analysis tools (`pip install -e '.[dev,analysis]'`) and requirements-baselines.txt,
# with every editable line rewritten to a path relative to the repository root (`-e .` for
# the project, `-e ./baselines/<name>` for each vendored clone). It is portable to any
# machine with the same Python and platform (Linux x86_64; the torch wheel is the default
# PyPI CUDA build).
#
# Install it from the repository root, after cloning the baselines at their pinned commits
# (baselines/README.md, section 1):
#   baselines/agentdojo        089ed468cf3ed0322acc66b0211f26d9d90dbf60
#   baselines/camel            f083b6b396399d3b3c7f2ddaf613a5945eaf32d8
#   baselines/nemo_guardrails  83d03ad529d2be1399f1dede24be59d4381ee42e
#   baselines/progent          b02783b896d4bf01a2adf24738015e258db8d35b
#   baselines/purple_llama     172c1074069eb88ec834124272c1b1c4f8893445 (not installed)
# then
#   python3.13 -m venv .venv
#   .venv/bin/pip install -r requirements-baselines.lock
# The engine freeze records each clone's HEAD and a hash of the installed packages, so the
# paper run refuses a venv or a clone that differs from the frozen one.
-e .
-e ./baselines/agentdojo
