[project]
name = "aebench"
version = "0.1.0"
description = "Framed autonomy by construction: the TonomyX artefact and its evaluation benchmark"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]
analysis = ["scipy>=1.13", "pandas>=2.2", "statsmodels>=0.14", "matplotlib>=3.9"]

[project.scripts]
aebench = "aebench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tonomyx*", "aebench*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv"]
# The core schema and its platform-rule triggers are read at runtime by reset_core.
"tonomyx.core" = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "db: requires a live PostgreSQL started by docker compose",
  "llm: calls a real local model through Ollama (slow, opt-in with -m llm)",
]
filterwarnings = [
  # Progent's vendored role_analyzer.py imports the deprecated sre_constants/sre_parse.
  "ignore::DeprecationWarning:secagent.role_analyzer",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The canon pack is read-only ground truth, not our code.
exclude = ["tests/fixtures/canon_pack_CASE-0031/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tonomyx", "aebench"]

[[tool.mypy.overrides]]
module = ["nemoguardrails", "nemoguardrails.*", "agentdojo", "agentdojo.*", "camel", "camel.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true  # vendored baseline, no stubs
