# A database of its own, on its own port, so benchmark runs never touch the
# database the TonomyX development checkout uses (tonomyx-postgres on 55432).
services:
  postgres:
    image: postgres:16-alpine
    container_name: aebench-postgres
    environment:
      POSTGRES_USER: tonomyx
      POSTGRES_PASSWORD: tonomyx
      POSTGRES_DB: tonomyx
      LANG: C.UTF-8
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonomyx -d tonomyx"]
      interval: 2s
      timeout: 3s
      retries: 30
